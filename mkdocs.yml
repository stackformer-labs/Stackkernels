site_name: StackKernels
site_description: Fast, fused Triton kernels for transformer models — PyTorch and JAX backends.
site_url: https://stackformer-labs.github.io/stackkernels/
repo_url: https://github.com/stackformer-labs/stackkernels
repo_name: stackformer-labs/stackkernels

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

nav:
  - Overview: index.md
  - Getting Started: getting_started.md
  - User Guide:
      - Normalization: user_guide/norm.md
      - Activations: user_guide/activation.md
      - Rotary Position Embedding: user_guide/rope.md
      - Loss Functions: user_guide/loss.md
      - Attention & Decode: user_guide/attention.md
      - Dropout, Cache & Sampling: user_guide/dropout_cache_sampling.md
      - JAX Guide: user_guide/jax.md
  - Optimization:
      - Overview: optimization/overview.md
      - Tuning Guide: optimization/tuning_guide.md
      - Design & Pipeline: optimization/design.md
      - FlashAttention Internals: optimization/flash_attn.md
      - RMSNorm Internals: optimization/rms_norm.md
  - Backends & Fallback: backends.md
  - Stackformer Integration: stackformer_integration.md
  - Architecture: architecture.md
  - Adding an Op: adding_an_op.md
  - Troubleshooting: troubleshooting.md
  - API Reference:
      - PyTorch: api/torch.md
      - JAX: api/jax.md
      - Optimization: api/opt.md

