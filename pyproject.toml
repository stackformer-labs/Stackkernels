[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackkernels"
version = "0.1.0"
description = "Fast, fused Triton kernels for transformer models — PyTorch and JAX backends."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.3,<3.0",
    "triton>=2.3",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4",
    "jax-triton",
]
dev = [
    "pytest",
    "pytest-benchmark",
]

[project.urls]
Homepage = "https://github.com/stackformer-labs/stackkernels"